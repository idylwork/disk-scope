[package]
name = "disk-scope"
version = "0.1.0"
description = "Disk usage explorer with a sunburst view"
authors = ["you"]
edition = "2021"

[lib]
name = "disk_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
